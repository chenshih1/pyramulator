[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pyramulator"
dynamic = ["version"]
description = "Discrete-event simulation (DES) framework for hardware architecture with a cycle-accurate DRAM model (Ramulator)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "pyramulator contributors"}]
keywords = [
    "discrete-event",
    "simulation",
    "dram",
    "memory",
    "hardware",
    "architecture",
    "ramulator",
    "cycle-accurate",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
urls = {Repository = "https://github.com/chenshih1/pyramulator"}

[project.optional-dependencies]
test = ["pytest"]
dev = ["pyramulator[test]", "ruff", "mypy", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pyramulator --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF", "PYI", "SIM"]
# PYI034: __enter__ returns the concrete type; typing.Self needs Python 3.11
ignore = ["PYI034"]

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
source = ["pyramulator"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "pyramulator/_version.py"
cmake.version = ">=3.20,<4.0"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["pyramulator"]
sdist.exclude = [
    "/build/",
    "/dist/",
    ".venv/",
    ".pytest_cache/",
    ".hypothesis/",
    # Ramulator is pulled in via the submodule or FetchContent at build
    # time; only its configs are needed in-tree (bundled into the wheel).
    "third_party/ramulator/cputraces/",
    "third_party/ramulator/trace_generator/",
    "third_party/ramulator/cpu.trace",
    "third_party/ramulator/dram.trace",
    "third_party/ramulator/gem5-*.patch",
    "third_party/ramulator/plot.py",
    "third_party/ramulator/test_*.py",
    "third_party/ramulator/temp.txt",
]
