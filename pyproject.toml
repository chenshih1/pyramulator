[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "pyramulator"
version = "0.1.0"
description = "Python bindings for Ramulator DRAM simulator"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "pyramulator contributors"}]
keywords = ["dram", "simulator", "ramulator", "memory", "hardware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
urls = {Repository = "https://gitee.com/chenshih1/pyramulator"}

[project.optional-dependencies]
test = ["pytest"]
dev = ["pyramulator[test]", "ruff", "mypy", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--cov=pyramulator --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF", "PYI"]
# PYI034: __enter__ returns the concrete type; typing.Self needs Python 3.11
ignore = ["PYI034"]

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
source = ["pyramulator"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.scikit-build]
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"
wheel.packages = ["pyramulator"]
sdist.exclude = [
    "/build/",
    "/dist/",
    ".venv/",
    ".pytest_cache/",
    ".hypothesis/",
]
